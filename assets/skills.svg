<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="440" height="320">
  <defs>
    <style>
      .bg { fill: #0A0E0A; }
      .panel-border { fill: none; stroke: #3D6600; stroke-width: 1; }
      .label {
        font-family: 'Courier New', monospace;
        font-size: 11px;
        fill: #599200;
      }
      .pct {
        font-family: 'Courier New', monospace;
        font-size: 10px;
        fill: #FFD700;
        animation: fadeIn 0.5s ease forwards;
      }
      .track { fill: #111a11; rx: 2; }
      .bar-python   { fill: url(#gp); animation: growBar 2.0s 0.2s ease forwards; width: 0; }
      .bar-pentest  { fill: url(#gr); animation: growBar 2.0s 0.4s ease forwards; width: 0; }
      .bar-scraping { fill: url(#gb); animation: growBar 2.0s 0.6s ease forwards; width: 0; }
      .bar-nlp      { fill: url(#gy); animation: growBar 2.0s 0.8s ease forwards; width: 0; }
      .bar-docker   { fill: url(#gd); animation: growBar 2.0s 1.0s ease forwards; width: 0; }
      .bar-linux    { fill: url(#gl); animation: growBar 2.0s 1.2s ease forwards; width: 0; }
      .bar-recon    { fill: url(#grc); animation: growBar 2.0s 1.4s ease forwards; width: 0; }
      .heading {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        fill: #FFD700;
        letter-spacing: 2px;
      }
      .scanline { fill: none; stroke: #1a2e1a; stroke-width: 1; opacity: 0.3; }
      @keyframes growBar {
        from { width: 0; }
        to   { width: var(--w); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
    </style>
    <linearGradient id="gp" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#1a4a00"/>
      <stop offset="100%" stop-color="#8ACC00"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#1a0000"/>
      <stop offset="100%" stop-color="#ff4444"/>
    </linearGradient>
    <linearGradient id="gb" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#001a1a"/>
      <stop offset="100%" stop-color="#00cccc"/>
    </linearGradient>
    <linearGradient id="gy" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#1a1a00"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <linearGradient id="gd" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#000d1a"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>
    <linearGradient id="gl" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#1a0a00"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </linearGradient>
    <linearGradient id="grc" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0d001a"/>
      <stop offset="100%" stop-color="#cc00ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="440" height="320" class="bg"/>
  <!-- scanlines -->
  <line x1="0" y1="30" x2="440" y2="30" class="scanline"/>
  <line x1="0" y1="60" x2="440" y2="60" class="scanline"/>
  <line x1="0" y1="90" x2="440" y2="90" class="scanline"/>
  <line x1="0" y1="120" x2="440" y2="120" class="scanline"/>
  <line x1="0" y1="150" x2="440" y2="150" class="scanline"/>
  <line x1="0" y1="180" x2="440" y2="180" class="scanline"/>
  <line x1="0" y1="210" x2="440" y2="210" class="scanline"/>
  <line x1="0" y1="240" x2="440" y2="240" class="scanline"/>
  <line x1="0" y1="270" x2="440" y2="270" class="scanline"/>
  <line x1="0" y1="300" x2="440" y2="300" class="scanline"/>
  <rect x="2" y="2" width="436" height="316" rx="4" class="panel-border" filter="url(#glow)"/>

  <text x="16" y="24" class="heading">// SKILL_MATRIX.exe</text>
  <line x1="6" y1="32" x2="434" y2="32" stroke="#3D6600" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Python -->
  <text x="16" y="58" class="label">PYTHON</text>
  <text x="400" y="58" class="pct">97%</text>
  <rect x="16" y="63" width="390" height="10" rx="2" class="track"/>
  <rect x="16" y="63" height="10" rx="2" class="bar-python" style="--w:378px;" filter="url(#glow)"/>

  <!-- Penetration Testing -->
  <text x="16" y="98" class="label">PENTEST &amp; EXPLOITATION</text>
  <text x="400" y="98" class="pct">91%</text>
  <rect x="16" y="103" width="390" height="10" rx="2" class="track"/>
  <rect x="16" y="103" height="10" rx="2" class="bar-pentest" style="--w:355px;" filter="url(#glow)"/>

  <!-- Web Scraping -->
  <text x="16" y="138" class="label">WEB SCRAPING &amp; CRAWLING</text>
  <text x="400" y="138" class="pct">94%</text>
  <rect x="16" y="143" width="390" height="10" rx="2" class="track"/>
  <rect x="16" y="143" height="10" rx="2" class="bar-scraping" style="--w:367px;" filter="url(#glow)"/>

  <!-- NLP / AI -->
  <text x="16" y="178" class="label">NLP / AI TOOLING</text>
  <text x="400" y="178" class="pct">85%</text>
  <rect x="16" y="183" width="390" height="10" rx="2" class="track"/>
  <rect x="16" y="183" height="10" rx="2" class="bar-nlp" style="--w:332px;" filter="url(#glow)"/>

  <!-- Docker / DevOps -->
  <text x="16" y="218" class="label">DOCKER / DEVOPS</text>
  <text x="400" y="218" class="pct">80%</text>
  <rect x="16" y="223" width="390" height="10" rx="2" class="track"/>
  <rect x="16" y="223" height="10" rx="2" class="bar-docker" style="--w:312px;" filter="url(#glow)"/>

  <!-- Linux / Systems -->
  <text x="16" y="258" class="label">LINUX / SYSTEMS</text>
  <text x="400" y="258" class="pct">93%</text>
  <rect x="16" y="263" width="390" height="10" rx="2" class="track"/>
  <rect x="16" y="263" height="10" rx="2" class="bar-linux" style="--w:363px;" filter="url(#glow)"/>

  <!-- Recon / OSINT -->
  <text x="16" y="298" class="label">RECON / OSINT</text>
  <text x="400" y="298" class="pct">88%</text>
  <rect x="16" y="303" width="390" height="10" rx="2" class="track"/>
  <rect x="16" y="303" height="10" rx="2" class="bar-recon" style="--w:343px;" filter="url(#glow)"/>
</svg>
