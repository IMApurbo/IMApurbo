<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

      .bg { fill: #0A0E0A; }
      .scanline {
        fill: none;
        stroke: #1a2e1a;
        stroke-width: 1;
        opacity: 0.4;
      }
      .border {
        fill: none;
        stroke: #599200;
        stroke-width: 2;
        rx: 4;
        animation: borderPulse 2s ease-in-out infinite;
      }
      .corner {
        fill: none;
        stroke: #FFD700;
        stroke-width: 2;
      }
      .title {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 38px;
        font-weight: bold;
        fill: #599200;
        letter-spacing: 6px;
        animation: glitch 4s infinite, textGlow 2s ease-in-out infinite alternate;
      }
      .title-shadow {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 38px;
        font-weight: bold;
        fill: none;
        stroke: #FFD700;
        stroke-width: 0.5;
        letter-spacing: 6px;
        opacity: 0;
        animation: glitchShadow 4s infinite;
      }
      .subtitle {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 13px;
        fill: #3D6600;
        letter-spacing: 3px;
        animation: fadeInOut 3s ease-in-out infinite alternate;
      }
      .cursor {
        fill: #599200;
        animation: blink 1s step-end infinite;
      }
      .prompt {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 11px;
        fill: #599200;
        animation: typeLine 6s steps(40) infinite;
      }
      .status-dot {
        animation: statusPulse 1.5s ease-in-out infinite;
      }
      .matrix-char {
        font-family: monospace;
        font-size: 11px;
        fill: #1a4a00;
        animation: matrixFall linear infinite;
      }
      .matrix-char.bright {
        fill: #599200;
        animation: matrixFallBright linear infinite;
      }
      .scanbar {
        fill: rgba(89,146,0,0.04);
        animation: scanMove 3s linear infinite;
      }
      .tag {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 10px;
        fill: #3D6600;
        letter-spacing: 1px;
      }
      .tag-bracket { fill: #FFD700; }
      .divider {
        stroke: #3D6600;
        stroke-width: 1;
        stroke-dasharray: 4 3;
        animation: dashMove 1s linear infinite;
      }

      @keyframes borderPulse {
        0%, 100% { stroke: #599200; stroke-width: 2; opacity: 1; }
        50% { stroke: #8ACC00; stroke-width: 2.5; opacity: 0.8; }
      }
      @keyframes glitch {
        0%,90%,100% { transform: translate(0,0); }
        91% { transform: translate(-2px, 1px); fill: #8ACC00; }
        92% { transform: translate(2px, -1px); fill: #FFD700; }
        93% { transform: translate(0, 0); fill: #599200; }
        94% { transform: translate(1px, 2px); fill: #00ff41; }
        95% { transform: translate(0, 0); fill: #599200; }
      }
      @keyframes glitchShadow {
        0%,90%,100% { opacity: 0; transform: translate(0,0); }
        91% { opacity: 0.6; transform: translate(3px, 0); stroke: #ff0040; }
        93% { opacity: 0; transform: translate(0,0); }
        94% { opacity: 0.4; transform: translate(-3px, 0); stroke: #00fff9; }
        96% { opacity: 0; }
      }
      @keyframes textGlow {
        from { filter: drop-shadow(0 0 4px #599200); }
        to { filter: drop-shadow(0 0 12px #8ACC00) drop-shadow(0 0 20px #599200); }
      }
      @keyframes fadeInOut {
        from { opacity: 0.4; }
        to { opacity: 1; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes statusPulse {
        0%, 100% { opacity: 1; r: 4; }
        50% { opacity: 0.3; r: 5; }
      }
      @keyframes matrixFall {
        0% { opacity: 0; transform: translateY(-20px); }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { opacity: 0; transform: translateY(180px); }
      }
      @keyframes matrixFallBright {
        0% { opacity: 0; transform: translateY(-20px); }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { opacity: 0; transform: translateY(180px); }
      }
      @keyframes scanMove {
        0% { y: -20; }
        100% { y: 200; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -7; }
      }
      @keyframes typeLine {
        0%,20% { clip-path: inset(0 100% 0 0); }
        60%,100% { clip-path: inset(0 0% 0 0); }
      }
    </style>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="180" class="bg"/>

  <!-- Scanlines -->
  <line x1="0" y1="20" x2="900" y2="20" class="scanline"/>
  <line x1="0" y1="40" x2="900" y2="40" class="scanline"/>
  <line x1="0" y1="60" x2="900" y2="60" class="scanline"/>
  <line x1="0" y1="80" x2="900" y2="80" class="scanline"/>
  <line x1="0" y1="100" x2="900" y2="100" class="scanline"/>
  <line x1="0" y1="120" x2="900" y2="120" class="scanline"/>
  <line x1="0" y1="140" x2="900" y2="140" class="scanline"/>
  <line x1="0" y1="160" x2="900" y2="160" class="scanline"/>

  <!-- Moving scan bar -->
  <rect x="0" width="900" height="40" class="scanbar"/>

  <!-- Matrix rain columns -->
  <text x="22" y="0"  class="matrix-char" style="animation-duration:2.3s; animation-delay:0s;">1</text>
  <text x="22" y="0"  class="matrix-char bright" style="animation-duration:2.3s; animation-delay:0.5s;">0</text>
  <text x="45" y="0"  class="matrix-char" style="animation-duration:3.1s; animation-delay:0.8s;">$</text>
  <text x="45" y="0"  class="matrix-char bright" style="animation-duration:3.1s; animation-delay:1.5s;">#</text>
  <text x="830" y="0" class="matrix-char" style="animation-duration:2.7s; animation-delay:0.3s;">0</text>
  <text x="830" y="0" class="matrix-char bright" style="animation-duration:2.7s; animation-delay:1.1s;">1</text>
  <text x="855" y="0" class="matrix-char" style="animation-duration:3.5s; animation-delay:0.2s;">!</text>
  <text x="855" y="0" class="matrix-char bright" style="animation-duration:3.5s; animation-delay:1.8s;">%</text>
  <text x="70"  y="0" class="matrix-char" style="animation-duration:4.0s; animation-delay:0.6s;">A</text>
  <text x="880" y="0" class="matrix-char" style="animation-duration:2.9s; animation-delay:1.3s;">Z</text>

  <!-- Border -->
  <rect x="4" y="4" width="892" height="172" rx="6" ry="6" class="border" filter="url(#glow)"/>

  <!-- Corner accents TL -->
  <polyline points="4,24 4,4 24,4" class="corner" filter="url(#glow)"/>
  <!-- TR -->
  <polyline points="876,4 896,4 896,24" class="corner" filter="url(#glow)"/>
  <!-- BL -->
  <polyline points="4,156 4,176 24,176" class="corner" filter="url(#glow)"/>
  <!-- BR -->
  <polyline points="876,176 896,176 896,156" class="corner" filter="url(#glow)"/>

  <!-- Top status bar -->
  <text x="14" y="18" class="tag" font-size="9">[SYS:ONLINE]</text>
  <circle cx="108" cy="13" r="4" fill="#00ff41" class="status-dot" filter="url(#glow)"/>
  <text x="800" y="18" class="tag" font-size="9">[SEC-LVL: 9]</text>

  <!-- Horizontal divider -->
  <line x1="8" y1="24" x2="892" y2="24" class="divider"/>

  <!-- Main title with glitch -->
  <text x="450" y="90" text-anchor="middle" class="title-shadow" filter="url(#strongGlow)">IMApurbo</text>
  <text x="450" y="90" text-anchor="middle" class="title" filter="url(#strongGlow)">IMApurbo</text>

  <!-- Subtitle -->
  <text x="450" y="118" text-anchor="middle" class="subtitle">
    [ ETHICAL HACKER • SECURITY RESEARCHER • PYTHON WIZARD ]
  </text>

  <!-- Divider -->
  <line x1="8" y1="138" x2="892" y2="138" class="divider"/>

  <!-- Bottom prompt line -->
  <text x="14" y="155" class="tag" font-size="10" fill="#3D6600">root@imapurbo:~$</text>
  <text x="138" y="155" class="prompt">./exploit --target=bugs --method=ethical --output=solutions</text>
  <rect x="622" y="143" width="8" height="14" class="cursor"/>

  <!-- Bottom status -->
  <text x="14" y="172" class="tag" font-size="8" fill="#1a4a00">CVEs_FOUND: 0 | SYSTEMS_SECURED: ∞ | COFFEE_CONSUMED: ☕☕☕</text>
  <circle cx="880" cy="167" r="4" fill="#FFD700" class="status-dot" filter="url(#glow)"/>
</svg>
