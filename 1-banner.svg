<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b07"/>
      <stop offset="100%" stop-color="#0d150d"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e0a" stop-opacity="0"/>
      <stop offset="60%" stop-color="#0a0e0a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0e0a" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="glowH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#599200" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#599200" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bgGrad)"/>

  <!-- Perspective grid -->
  <g stroke="#1a2e1a" stroke-width="0.5" fill="none">
    <line x1="0" y1="130" x2="900" y2="130" opacity=".8"/>
    <line x1="0" y1="148" x2="900" y2="148" opacity=".6"/>
    <line x1="0" y1="163" x2="900" y2="163" opacity=".45"/>
    <line x1="0" y1="175" x2="900" y2="175" opacity=".35"/>
    <line x1="0" y1="185" x2="900" y2="185" opacity=".25"/>
    <line x1="0" y1="193" x2="900" y2="193" opacity=".18"/>
    <line x1="450" y1="80" x2="0"   y2="220" opacity=".5"/>
    <line x1="450" y1="80" x2="225" y2="220" opacity=".5"/>
    <line x1="450" y1="80" x2="450" y2="220" opacity=".5"/>
    <line x1="450" y1="80" x2="675" y2="220" opacity=".5"/>
    <line x1="450" y1="80" x2="900" y2="220" opacity=".5"/>
  </g>
  <rect x="0" y="120" width="900" height="20" fill="url(#glowH)"/>

  <!-- LEFT: particle network -->
  <g>
    <g stroke="#599200" stroke-width="0.8" fill="none" opacity=".25">
      <line x1="80"  y1="45"  x2="145" y2="80"/>
      <line x1="145" y1="80"  x2="110" y2="105"/>
      <line x1="145" y1="80"  x2="185" y2="55"/>
      <line x1="185" y1="55"  x2="210" y2="88"/>
      <line x1="110" y1="105" x2="160" y2="112"/>
      <line x1="160" y1="112" x2="210" y2="88"/>
      <line x1="60"  y1="85"  x2="110" y2="105"/>
    </g>
    <g fill="#599200">
      <circle cx="80"  cy="45"  r="3">
        <animate attributeName="opacity" values=".15;.8;.15" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="145" cy="80"  r="5">
        <animate attributeName="opacity" values=".3;1;.3" dur="3.3s" begin=".7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="110" cy="105" r="3">
        <animate attributeName="opacity" values=".15;.8;.15" dur="2.7s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="185" cy="55"  r="3">
        <animate attributeName="opacity" values=".15;.8;.15" dur="1.9s" begin=".4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="210" cy="88"  r="4">
        <animate attributeName="opacity" values=".3;1;.3" dur="2.5s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="112" r="2.5">
        <animate attributeName="opacity" values=".15;.8;.15" dur="3.1s" begin=".9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60"  cy="85"  r="2.5">
        <animate attributeName="opacity" values=".3;1;.3" dur="2.3s" begin=".2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- CENTER: title -->
  <text x="450" y="52" font-size="32" font-weight="700" text-anchor="middle"
    font-family="'Courier New',Courier,monospace" fill="#599200">IMApurbo</text>
  <rect x="548" y="28" width="3" height="20" rx="1" fill="#599200">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.49;.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="74" font-size="11" text-anchor="middle"
    font-family="'Courier New',Courier,monospace" fill="#3a6000">
    Python Developer · Automation Master · Security Researcher
  </text>
  <text x="450" y="96" font-size="9.5" text-anchor="middle"
    font-family="'Courier New',Courier,monospace" fill="#2a4800" opacity=".9">
    $ python exploit.py --target=world --mode=ethical --verbose
  </text>

  <rect x="280" y="104" width="340" height="14" rx="3" fill="#0f1a0f" stroke="#1a2e1a" stroke-width=".5"/>
  <rect x="282" y="106" rx="2" fill="#1a3300" opacity=".85" height="10">
    <animate attributeName="width" values="0;170;170" dur="2.5s" fill="freeze"/>
  </rect>
  <text x="450" y="116" font-size="7.5" text-anchor="middle"
    font-family="'Courier New',Courier,monospace" fill="#599200" opacity=".7">
    SYSTEM ONLINE · ALL MODULES LOADED · READY
  </text>

  <!-- RIGHT: orbital sphere -->
  <g>
    <g fill="none" stroke="#599200">
      <ellipse cx="770" cy="70" rx="52" ry="18" stroke-width="0.5" opacity=".2"/>
      <ellipse cx="770" cy="70" rx="38" ry="42" stroke-width="0.5" opacity=".15"/>
      <ellipse cx="770" cy="70" rx="28" ry="12" stroke-width="0.5" opacity=".12" transform="rotate(-30,770,70)"/>
    </g>
    <circle cx="770" cy="70" r="14" fill="#0f1a0f" stroke="#599200" stroke-width="1.2" opacity=".9"/>
    <circle cx="770" cy="70" r="8" fill="#1a3300" opacity=".6"/>
    <circle cx="770" cy="70" r="4" fill="#599200" opacity=".8">
      <animate attributeName="r" values="4;5.5;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;1;.8" dur="2s" repeatCount="indefinite"/>
    </circle>

    <circle r="2.5" fill="#7ab800">
      <animateMotion dur="6s" repeatCount="indefinite"
        path="M 770,70 m -38,0 a 38,38 0 1,0 76,0 a 38,38 0 1,0 -76,0"/>
    </circle>
    <circle r="2" fill="#599200">
      <animateMotion dur="9s" repeatCount="indefinite"
        path="M 770,70 m -52,0 a 52,52 0 1,0 104,0 a 52,52 0 1,0 -104,0"/>
    </circle>
    <circle r="1.8" fill="#3d6600">
      <animateMotion dur="4.5s" repeatCount="indefinite"
        path="M 770,70 m -28,0 a 28,28 0 1,0 56,0 a 28,28 0 1,0 -56,0"/>
    </circle>

    <circle cx="820" cy="40" r="2" fill="#599200"/>
    <circle cx="835" cy="90" r="1.8" fill="#599200"/>
    <circle cx="730" cy="30" r="2" fill="#599200"/>
    <line x1="820" y1="40" x2="784" y2="56" stroke="#599200" stroke-width=".8" opacity=".2"/>
    <line x1="730" y1="30" x2="756" y2="56" stroke="#599200" stroke-width=".8" opacity=".2"/>
  </g>

  <!-- binary rain -->
  <g font-family="'Courier New',Courier,monospace" font-size="7" fill="#1a2e1a" text-anchor="middle">
    <text x="30"  y="140" opacity=".6">01</text><text x="60"  y="145" opacity=".5">10</text>
    <text x="90"  y="141" opacity=".7">11</text><text x="120" y="143" opacity=".4">01</text>
    <text x="150" y="140" opacity=".6">10</text><text x="180" y="144" opacity=".5">00</text>
    <text x="750" y="140" opacity=".6">10</text><text x="780" y="143" opacity=".5">01</text>
    <text x="810" y="140" opacity=".7">11</text><text x="840" y="142" opacity=".4">00</text>
    <text x="870" y="141" opacity=".6">10</text>
  </g>

  <rect x="0" y="130" width="900" height="90" fill="url(#gridFade)"/>
  <line x1="0" y1="219" x2="900" y2="219" stroke="#599200" stroke-width=".5" opacity=".2"/>
  <line x1="200" y1="219" x2="700" y2="219" stroke="#599200" stroke-width="1" opacity=".4"/>
</svg>
